services:
  tg-forecast:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tg-forecast-bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Europe/Lisbon
      - DB_PATH=/app/data/tg_forecast.db
    env_file:
      - .env
    volumes:
      - .:/app:ro
      - ./images:/app/images
      - ./data:/app/data
    mem_limit: 256m
    mem_reservation: 128m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
