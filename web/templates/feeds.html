{% extends "base.html" %}
{% block content %}
<h2>Gestão de Feeds RSS</h2>
<div class="card">
    <form method="POST" action="{{ url_for('feeds') }}" class="d-flex">
        <div class="flex-1">
            <label>Nome do Feed</label>
            <input type="text" name="name" required placeholder="Ex: Notícias Sapo">
        </div>
        <div class="flex-1">
            <label>URL (RSS/Atom)</label>
            <input type="url" name="url" required placeholder="https://...">
        </div>
        <div>
            <!-- A margem inferior 1rem nivela o botão com os inputs, que têm margin-bottom: 1rem -->
            <button type="submit" style="margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
                <span class="material-symbols-outlined" style="font-size: 1.2rem;">add</span>
                Adicionar
            </button>
        </div>
    </form>
</div>

<div class="card">
    <h3>Feeds Configurados</h3>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Última Verificação</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for feed in feeds %}
            <tr>
                <td>{{ feed.id }}</td>
                <td>{{ feed.name }}</td>
                <td>{{ feed.last_checked or 'Nunca' }}</td>
                <td>
                    <div style="display: flex; gap: 0.25rem;">
                        <button type="button" class="btn-icon" title="Editar" onclick="editFeed('{{ feed.id }}', '{{ feed.name }}', '{{ feed.url }}')">
                            <span class="material-symbols-outlined">edit</span>
                        </button>
                        <button type="button" class="btn-icon danger" title="Remover" onclick="deleteFeed('{{ feed.id }}', '{{ feed.name }}')">
                            <span class="material-symbols-outlined">delete</span>
                        </button>
                    </div>
                </td>
            </tr>
            {% else %}
            <tr><td colspan="4">Nenhum feed configurado.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<script>
function editFeed(id, currentName, currentUrl) {
    let safeName = currentName.replace(/"/g, '&quot;');
    let safeUrl = currentUrl.replace(/"/g, '&quot;');
    
    let formHtml = `
        <form method="POST" action="/feeds/edit/${id}">
            <label>Nome do Feed</label>
            <input type="text" name="name" value="${safeName}" required>
            
            <label>URL (RSS/Atom)</label>
            <input type="url" name="url" value="${safeUrl}" required>
            
            <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1rem;">
                <button type="button" onclick="closeModal()" style="background-color: transparent; border: 1px solid var(--border-color); color: var(--text-color);">Cancelar</button>
                <button type="submit">Guardar Alterações</button>
            </div>
        </form>
    `;
    
    showModal("Editar Feed", formHtml);
}

function deleteFeed(id, currentName) {
    let safeName = currentName.replace(/"/g, '&quot;');
    let formHtml = `
        <form method="POST" action="/feeds/delete/${id}">
            <p>Tem a certeza que pretende remover o feed <strong>${safeName}</strong>?</p>
            <p style="color: var(--danger-color); font-size: 0.9rem;">Esta ação é irreversível.</p>
            <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem;">
                <button type="button" onclick="closeModal()" style="background-color: transparent; border: 1px solid var(--border-color); color: var(--text-color);">Cancelar</button>
                <button type="submit" class="btn-danger">Remover Definitivamente</button>
            </div>
        </form>
    `;
    
    showModal("Remover Feed", formHtml);
}
</script>
{% endblock %}
