<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>TG Forecast & Feeds</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('feeds') }}">Feeds</a>
        <a href="{{ url_for('settings') }}">Configurações</a>
        <a href="{{ url_for('logs') }}">Logs</a>
    </nav>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        {% block content %}{% endblock %}
    </div>

    <!-- Global Modal Structure -->
    <div id="global-modal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modal-title" style="margin: 0;">Título</h3>
                <button class="btn-icon" onclick="closeModal()">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div id="modal-content" class="modal-body">
                <!-- Content gets injected here -->
            </div>
        </div>
    </div>

    <script>
        function showModal(title, contentHtml) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-content').innerHTML = contentHtml;
            document.getElementById('global-modal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('global-modal').style.display = 'none';
        }
    </script>
</body>
</html>
