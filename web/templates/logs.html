{% extends "base.html" %}
{% block content %}
<h2>Logs do Sistema</h2>
<div class="terminal">
    {% for log in logs %}
        <div class="log-line">
            <span class="log-time">[{{ log.timestamp }}]</span>
            <span class="log-level level-{{ log.level|lower }}">{{ log.level }}</span>: 
            <span class="log-msg">{{ log.message }}</span>
        </div>
    {% else %}
        <div class="log-line">Nenhum log disponível.</div>
    {% endfor %}
</div>

<style>
.terminal {
    background-color: #0a0a0a;
    color: #0f0;
    font-family: 'Consolas', 'Courier New', Courier, monospace;
    font-size: 0.9rem;
    padding: 1.5rem;
    border-radius: 8px;
    border: 1px solid #333;
    height: 500px;
    overflow-y: auto;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    display: flex;
    flex-direction: column;
}
.log-line {
    margin-bottom: 0.3rem;
    word-wrap: break-word;
    line-height: 1.4;
}
.log-time {
    color: #666;
    margin-right: 8px;
}
.log-level {
    font-weight: bold;
    display: inline-block;
    width: 65px;
}
.level-info { color: #4cb3d4; }
.level-warning { color: #ffb86c; }
.level-error { color: #ff5555; }
.level-critical { color: #ff5555; background-color: #440000; padding: 0 4px;}
.log-msg {
    color: #f8f8f2;
}

/* Custom scrollbar for terminal */
.terminal::-webkit-scrollbar {
    width: 10px;
}
.terminal::-webkit-scrollbar-track {
    background: #111;
    border-radius: 4px;
}
.terminal::-webkit-scrollbar-thumb {
    background: #444;
    border-radius: 4px;
}
.terminal::-webkit-scrollbar-thumb:hover {
    background: #555;
}
</style>
{% endblock %}
